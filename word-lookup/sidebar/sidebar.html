

<html>
    <head>
        <title>Word Lookup Sidebar</title>
        <link rel="stylesheet" href="sidebar.css">
    </head>
    <body>
    <div>
        <label for= "site-search">Search a word: </label>
        <input type="text" id = "site-search" placeholder="Enter a word...">
        <button id = "search-button" type = "submit">Search</button>
    </div>
        <div class = "my-box" >
            <h1>Word Definition: </h1>
            <div id="output-search"></div>
        </div>
        <div>
            <button id = "save-button">Save to Notion</button>
        </div>
        <div>
<!-- Settings View Panel -->
<div id="settings-panel" class="panel">
  <h2>Notion Settings</h2>

  <!-- Token Input -->
  <div class="form-group">
    <label for="notion-token-input">Integration Token</label>
    <input 
      type="password" 
      id="notion-token-input" 
      placeholder="ntn_... or secret_..."
      autocomplete="off"
    />
  </div>

  <!-- Database ID Input -->
  <div class="form-group">
    <label for="notion-db-input">Database ID</label>
    <input 
      type="text" 
      id="notion-db-input" 
      placeholder="e.g. 32-character ID"
      autocomplete="off"
    />
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button id="save-settings-btn" class="btn-primary">Save Credentials</button>
    <button id="back-btn" class="btn-secondary">Back</button>
  </div>

  <!-- Status Feedback -->
  <p id="status-message" class="status-text" aria-live="polite"></p>
</div>        </div>



<!---This section allows for user to send to database a typed explanation of a word-->
<div>

  <section style ="padding:10px">
    <h1>Input your statement or word here: </h1> 
    <label for= "input-box" style = "font-style: italic">Input your statement/word here</label>
    <input id ="input-box" placeholder="Enter a word or Statement ">
  </section>
  <section style = "padding: 10px;">
    <label for = "text-areaBox"><strong>Write your explanation here</strong></label>
    <textarea id = "text-areaBox"  class = "secondBox"></textarea>
    <button id="saveToNotion2">Send To Notion</button>
  </section>

</div>

  

</body>
<script src ="../config.js"></script>
<script src = "../api.js"></script>
<script src = "sidebar.js"></script>

    </body>
</html>
